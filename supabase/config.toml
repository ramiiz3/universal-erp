
project_id = "universal-erp"

[experimental]
stack = true

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[studio]
enabled = true
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
enable_signup = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
  "http://localhost:5175/**",
  "http://127.0.0.1:5175/**"
]

[auth.email]
double_confirm_changes = true
enable_confirmations = false

[functions.send-invoice]
verify_jwt = true

[functions.zaki-ai]
verify_jwt = false
