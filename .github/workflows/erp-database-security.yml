name: ERP database and storage security

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/local-supabase.mjs"
      - "scripts/test-database-security.mjs"
      - "scripts/test-storage-api-security.mjs"
      - ".github/workflows/erp-database-security.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/local-supabase.mjs"
      - "scripts/test-database-security.mjs"
      - "scripts/test-storage-api-security.mjs"
      - ".github/workflows/erp-database-security.yml"

jobs:
  local-database-security:
    name: Local Supabase migrations, RLS, and Storage security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start isolated local Supabase stack
        run: npx supabase start

      - name: Run database migration and RLS/workflow tests
        run: npm run test:db:security

      - name: Run local Storage API security tests
        run: npm run test:storage:security

      - name: Stop isolated local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
