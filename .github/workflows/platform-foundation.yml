name: Universal ERP platform checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: universal_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d universal_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test existing ERP
        run: npm test
      - name: Test API authentication and tenant policy helpers
        run: npm run api:test
      - name: Build existing frontend
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Create non-owner API database role
        env:
          MIGRATIONS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/universal_erp_test
          PGPASSWORD: postgres
        run: |
          psql "$MIGRATIONS_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE erp_app LOGIN PASSWORD 'erp_app_test_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
          psql "$MIGRATIONS_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "GRANT CONNECT ON DATABASE universal_erp_test TO erp_app"
      - name: Apply PostgreSQL migrations
        env:
          MIGRATIONS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/universal_erp_test
        run: npm run db:migrate
      - name: Verify cross-company row-level security
        env:
          SECURITY_TEST_DATABASE_URL: postgresql://erp_app:erp_app_test_password@localhost:5432/universal_erp_test
        run: npm run db:test:isolation
